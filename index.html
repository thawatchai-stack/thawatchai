<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thawatchai - ระบบบอร์ดส่งงานออนไลน์</title>
<meta name="description" content="Thawatchai - ระบบบอร์ดส่งงานสำหรับการเรียนการสอน พร้อมบันทึกข้อมูลออนไลน์">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0f766e;--primary-light:#14b8a6;--accent:#6366f1;--dark:#0f172a;--glass:rgba(15,23,42,0.85);--glass2:rgba(255,255,255,0.08);--text:#f1f5f9;--text2:#94a3b8;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,0.5)}
body{font-family:'IBM Plex Sans Thai','Prompt',sans-serif;background:#0a0f1e;color:var(--text);min-height:100vh;overflow-x:hidden}
.loading-overlay{position:fixed;inset:0;background:rgba(10,15,30,0.9);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.loading-overlay.active{display:flex}
.spinner{width:50px;height:50px;border:5px solid rgba(255,255,255,0.1);border-top-color:var(--primary-light);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.bg-fixed{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0a0f1e 0%,#0d1b2a 30%,#1b2a4a 60%,#0f766e 100%);opacity:.9}
.bg-fixed::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(99,102,241,0.15),transparent 50%),radial-gradient(circle at 80% 20%,rgba(20,184,166,0.15),transparent 50%),radial-gradient(circle at 50% 80%,rgba(99,102,241,0.1),transparent 50%)}
.particles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.05);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.app{position:relative;z-index:1;min-height:100vh}
/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;backdrop-filter:blur(20px);background:var(--glass);border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:700;cursor:pointer}
.logo i{color:var(--primary-light);font-size:1.8rem}
.logo span{background:linear-gradient(135deg,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:12px}
.btn{padding:10px 22px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:500;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.4)}
.btn-glass{background:var(--glass2);color:var(--text);border:1px solid rgba(255,255,255,0.1)}
.btn-glass:hover{background:rgba(255,255,255,0.15)}
.btn-danger{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:rgba(239,68,68,0.3)}
.btn-sm{padding:6px 14px;font-size:.8rem;border-radius:8px}
/* Pages */
.page{display:none;animation:fadeIn .4s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Landing */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 70px);text-align:center;padding:40px 20px}
.landing h1{font-size:3.5rem;font-weight:700;margin-bottom:16px;background:linear-gradient(135deg,#fff,var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.landing p{font-size:1.2rem;color:var(--text2);margin-bottom:40px;max-width:500px}
/* Template Selection */
.template-page{padding:40px 32px;max-width:1100px;margin:0 auto}
.template-page h2{font-size:1.8rem;margin-bottom:8px}
.template-page p{color:var(--text2);margin-bottom:32px}
.template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.template-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:32px 24px;text-align:center;cursor:pointer;transition:all .3s}
.template-card:hover{transform:translateY(-6px);border-color:var(--primary-light);box-shadow:0 12px 40px rgba(20,184,166,0.15)}
.template-card.selected{border-color:var(--primary-light);box-shadow:0 0 0 2px var(--primary-light),0 12px 40px rgba(20,184,166,0.2)}
.template-icon{font-size:3rem;margin-bottom:16px;color:var(--primary-light)}
.template-card h3{font-size:1.2rem;margin-bottom:8px}
.template-card p{font-size:.85rem;color:var(--text2)}
/* Board Name */
.board-name-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 70px);padding:40px 20px}
.name-form{background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:48px;width:100%;max-width:500px;text-align:center}
.name-form h2{margin-bottom:24px;font-size:1.6rem}
.input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;transition:all .3s}
.input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(20,184,166,0.15)}
.input::placeholder{color:var(--text2)}
textarea.input{min-height:80px;resize:vertical}
/* Board View */
.board-header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;flex-wrap:wrap;gap:12px}
.board-title{font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:10px}
.board-title i{color:var(--primary-light)}

/* Classroom Tabs */
.classroom-tabs {display:flex; gap:12px; overflow-x:auto; padding:0 32px 16px; border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:20px;}
.classroom-tab {padding:10px 20px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:12px; cursor:pointer; white-space:nowrap; transition:all .2s; display:flex; align-items:center; gap:10px; font-weight:500; font-family:inherit; color:var(--text);}
.classroom-tab:hover {background:rgba(255,255,255,0.08);}
.classroom-tab.active {background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(99,102,241,0.15)); border-color:var(--primary-light); color:var(--primary-light);}

.board-body{padding:0 32px 40px;max-width:1200px;margin:0 auto}
/* Sections */
.sections-container{display:flex;gap:24px;align-items:flex-start}
/* Wall: Wrapped Grid */
.sections-container.layout-wall{flex-wrap:wrap}
/* Column: Horizontal Scroll (Kanban) */
.sections-container.layout-column{flex-wrap:nowrap;overflow-x:auto;padding-bottom:16px}
/* Timeline: Vertical list with line */
.sections-container.layout-timeline{flex-direction:column;position:relative;padding-left:40px}
.sections-container.layout-timeline::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--primary-light),var(--accent));border-radius:3px}
/* Uniform Section Size */
.section{width:350px;max-width:90vw;flex:0 0 auto;background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);overflow:hidden;transition:all .3s}
.sections-container.layout-timeline .section{position:relative}
.sections-container.layout-timeline .section::before{content:'';position:absolute;left:-32px;top:28px;width:14px;height:14px;background:var(--primary-light);border-radius:50%;border:3px solid var(--dark);z-index:1}
.section:hover{border-color:rgba(255,255,255,0.15)}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06)}
.section-name{font-weight:600;font-size:1.05rem;display:flex;align-items:center;transition:all .2s;color:var(--primary-light);outline:none;border-radius:6px;padding:2px 6px}
.section-name:hover{background:rgba(255,255,255,0.05)}
.section-name i:first-child{margin-right:8px;font-size:.9rem}
.section-name-edit{cursor:text;border-bottom:1px dashed transparent}
.section-name-edit:focus{border-bottom-color:var(--primary-light);background:rgba(255,255,255,0.08)}
.section-actions{display:flex;gap:4px}
.icon-btn{width:34px;height:34px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .2s}
.icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.section-body{padding:16px 20px}
.section-desc{color:var(--text);font-size:.9rem;margin-bottom:14px;min-height:40px;padding:10px;border-radius:8px;cursor:text;transition:background .2s;white-space:pre-wrap;border:1px solid transparent}
.section-desc:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.05)}
.section-desc[contenteditable=true]:focus{outline:none;background:rgba(255,255,255,0.06);border-color:var(--primary-light)}
.section-desc:empty::before{content:attr(data-placeholder);color:var(--text2);font-style:italic}
/* Posts */
.posts{display:flex;flex-direction:column;gap:12px}
.post{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px 16px;transition:all .2s}
.post:hover{background:rgba(255,255,255,0.07)}
.post-title{font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.post-title i{color:var(--accent);font-size:.8rem}
.post-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.attachment{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(99,102,241,0.15);border-radius:6px;font-size:.75rem;color:#a5b4fc}
.post-actions{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.add-post-btn{width:100%;padding:12px;border:2px dashed rgba(255,255,255,0.1);border-radius:12px;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:.9rem;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.add-post-btn:hover{border-color:var(--primary-light);color:var(--primary-light);background:rgba(20,184,166,0.05)}
.add-section-btn{width:100%;max-width:400px;margin:0 auto;padding:16px;border:2px dashed rgba(255,255,255,0.1);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-size:1rem;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:10px}
.add-section-btn:hover{border-color:var(--primary-light);color:var(--primary-light);background:rgba(20,184,166,0.05)}
/* Board List */
.board-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:28px;width:100%;max-width:900px}
.board-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .3s;text-align:left;position:relative}
.board-card:hover{transform:translateY(-4px);border-color:var(--primary-light);box-shadow:0 10px 30px rgba(20,184,166,0.15)}
.board-card-title{font-weight:600;font-size:1rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:var(--primary-light)}
.board-card-date{font-size:.75rem;color:var(--text2)}
.board-card-del{position:absolute;top:10px;right:10px;width:28px;height:28px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .2s}
.board-card-del:hover{background:rgba(239,68,68,0.2);color:#f87171}
.landing-section{width:100%;max-width:900px;margin-top:32px;text-align:left}
.landing-section h2{font-size:1rem;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.board-card-actions{display:flex;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
.board-card-act{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 8px;border:1px solid rgba(255,255,255,0.08);border-radius:8px;background:transparent;color:var(--text2);font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .2s}
.board-card-act:hover{border-color:var(--primary-light);color:var(--primary-light);background:rgba(20,184,166,0.06)}
.board-card-act.danger:hover{border-color:#f87171;color:#f87171;background:rgba(239,68,68,0.06)}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:24px;width:100%;max-width:380px;animation:modalIn .3s ease}
.modal.modal-sm{max-width:340px;padding:20px}
@keyframes modalIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:1.3rem;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.modal h3 i{color:var(--primary-light)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
/* Toast */
.toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-size:.9rem;z-index:300;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);animation:slideInToast .3s ease;color:var(--text)}
.toast i{color:var(--primary-light)}
@keyframes slideInToast{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* Context Menu */
.ctx-menu{position:fixed;z-index:200;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:6px;min-width:200px;box-shadow:var(--shadow);display:none}
.ctx-menu.show{display:block}
.ctx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .15s;color:var(--text);border:none;background:none;width:100%;font-family:inherit;text-align:left}
.ctx-item:hover{background:rgba(255,255,255,0.08)}
.ctx-item i{width:18px;text-align:center;color:var(--primary-light)}
/* Attachment */
.attach-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.attach-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:20px;background:rgba(255,255,255,0.05);color:var(--text2);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s}
.attach-btn:hover{border-color:var(--primary-light);color:var(--primary-light);background:rgba(20,184,166,0.08)}
.attach-btn i{font-size:.8rem}
.attach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.25);font-size:.75rem;color:#a5b4fc}
.chip i{font-size:.75rem}
.chip-del{margin-left:4px;cursor:pointer;color:var(--text2);padding:0 2px}
.chip-del:hover{color:#f87171}
.link-input-row{display:flex;gap:6px;margin-top:8px}
.link-input-row .input{flex:1;padding:8px 12px;font-size:.85rem}
.post-meta{font-size:.8rem;color:var(--text2);margin-top:4px}
.post-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
/* Image Previews */
.post-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.post-img-thumb{max-width:calc(50% - 3px);width:auto;max-height:160px;border-radius:8px;object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,0.1);transition:opacity .2s}
.post-img-thumb:hover{opacity:.85}
.post-img-thumb.single{max-width:100%;max-height:200px}
.attach-preview-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.attach-preview-item{position:relative;display:inline-flex}
.attach-preview-img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,0.12)}
.attach-preview-del{position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
</style>
</head>
<body>
<div class="bg-fixed"></div>
<div class="particles" id="particles"></div>
<div class="app">
<!-- Header -->
<div class="header">
<div class="logo" onclick="goHome()"><i class="fas fa-layer-group"></i><span>Thawatchai</span></div>
<div class="header-actions" id="headerActions"></div>
</div>

<!-- Page: Landing -->
<div class="page active" id="pageLanding">
<div class="landing" style="align-items:center">
  <h1>🎓 Thawatchai Board</h1>
  <p>เลือกกระดานส่งงานด้านล่างเพื่อเข้าสู่บทเรียน หรือเข้าผ่านลิงก์ที่คุณครูส่งให้</p>
  <div class="landing-section" id="myBoardsSection" style="display:none">
    <h2><i class="fas fa-chalkboard"></i> กระดานส่งงานทั้งหมด</h2>
    <div class="board-list" id="boardList"></div>
  </div>
</div>
</div>



<!-- Page: Board View -->
<div class="page" id="pageBoard">
<div class="board-header">
<div class="board-title"><i class="fas fa-chalkboard"></i><span id="boardTitleText"></span></div>
<div id="boardControls"></div>
</div>

<!-- Classroom Tabs -->
<div class="classroom-tabs" id="studentClassroomTabs"></div>

<div class="board-body">
<div id="sectionsContainer" class="sections-container"></div>
</div>
</div>
</div>

<!-- Modals -->
<!-- Hidden file inputs -->
<input type="file" id="inp_file" multiple style="display:none" onchange="handleAttach(this,'file')">
<input type="file" id="inp_img" accept="image/*" multiple style="display:none" onchange="handleAttach(this,'image')">
<input type="file" id="inp_cam" accept="image/*" capture="environment" style="display:none" onchange="handleAttach(this,'camera')">

<div class="modal-overlay" id="modalPost">
<div class="modal modal-sm" style="max-width:420px">
  <h3 style="font-size:1.1rem;margin-bottom:14px" id="modalPostTitle"><i class="fas fa-plus-circle"></i>เพิ่มโพสต์</h3>
  <div class="form-group">
    <label>ชื่อเรื่อง <span style="color:#f87171">*</span></label>
    <input class="input" id="postTitle" placeholder="หัวข้อโพสต์...">
  </div>
  <div class="form-group">
    <label>รายละเอียด</label>
    <textarea class="input" id="postDesc" rows="2" style="min-height:50px" placeholder="เนื้อหาโพสต์ (ไม่บังคับ)"></textarea>
  </div>
  <div class="form-group">
    <label>แนบไฟล์</label>
    <div class="attach-bar">
      <button class="attach-btn" onclick="document.getElementById('inp_file').click()"><i class="fas fa-paperclip"></i>เลือกไฟล์</button>
      <button class="attach-btn" onclick="document.getElementById('inp_img').click()"><i class="fas fa-image"></i>รูปภาพ</button>
      <button class="attach-btn" onclick="document.getElementById('inp_cam').click()"><i class="fas fa-camera"></i>ถ่ายภาพ</button>
      <button class="attach-btn" onclick="addLinkAttach()"><i class="fas fa-link"></i>ลิงก์</button>
      <button class="attach-btn" onclick="addOtherAttach()"><i class="fas fa-ellipsis-h"></i>อื่นๆ</button>
    </div>
    <div class="attach-chips" id="attachChips"></div>
  </div>
  <div class="modal-actions" style="margin-top:16px">
    <button class="btn btn-glass btn-sm" onclick="closeModal('modalPost')">ยกเลิก</button>
    <button class="btn btn-primary btn-sm" onclick="savePost()"><i class="fas fa-check"></i>บันทึก</button>
  </div>
</div>
</div>

<div class="modal-overlay" id="modalConfirm">
<div class="modal" style="max-width:400px;text-align:center">
<h3>ยืนยันการลบ</h3>
<p id="confirmText" style="margin-bottom:20px;color:var(--text2)"></p>
<div class="modal-actions" style="justify-content:center">
<button class="btn btn-glass" onclick="closeModal('modalConfirm')">ยกเลิก</button>
<button class="btn btn-danger" id="confirmOkBtn">ลบ</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAW8vcTatshwGbi9N_SOJoxhwt9ckPiYis",
  authDomain: "classcoin-99bf6.firebaseapp.com",
  databaseURL: "https://classcoin-99bf6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classcoin-99bf6",
  storageBucket: "classcoin-99bf6.firebasestorage.app",
  messagingSenderId: "736532364280",
  appId: "1:736532364280:web:6f3b07131119c1e0e1b40d",
  measurementId: "G-PR39YY9NJS"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let boardId = null, boardData = {name:'', classrooms:[]}, tpl = 'wall', curIdx = null, activeClassroomIndex = 0;

async function save(){ 
    if(boardId) {
        await set(ref(db, 'boards/'+boardId), boardData); 
        await set(ref(db, 'boards_index/'+boardId), { 
            name: boardData.name, 
            ts: Date.now(), 
            tpl: boardData.tpl || 'wall',
            createdBy: boardData.createdBy || null
        });
    }
}

async function load(id){
    document.getElementById('loadingOverlay').classList.add('active');
    
    // Listen for realtime updates on this specific board instead of just get()
    onValue(ref(db, 'boards/'+id), (snap) => {
        if(snap.exists()){
            boardId = id; 
            boardData = snap.val(); 
            tpl = boardData.tpl || 'wall';
            
            // Migrate old data on the fly
            if(boardData.sections && !boardData.classrooms) {
                boardData.classrooms = [{
                    id: Date.now(),
                    name: 'ห้องเรียนรวม',
                    assignments: boardData.sections
                }];
                // We don't delete sections from db here since it's a readonly listener usually, but we modify our local object.
                delete boardData.sections;
            }
            if(!boardData.classrooms) boardData.classrooms = [];
            
            render(); 
            showPage('pageBoard');
            document.getElementById('headerActions').innerHTML = `
                <button class="btn btn-glass btn-sm" onclick="shareBoard()"><i class="fas fa-share-alt"></i> แชร์</button>
                <button class="btn btn-glass btn-sm" onclick="goHome()"><i class="fas fa-home"></i> หน้าหลัก</button>
            `;
        } else {
            showToast('ไม่พบบอร์ดนี้ในระบบ','fas fa-exclamation-triangle');
            window.location.hash = '';
            goHome();
        }
        document.getElementById('loadingOverlay').classList.remove('active');
    });
}

window.selectStudentClassroom = (i) => {
    activeClassroomIndex = i;
    render();
};

function render(){
    document.getElementById('boardTitleText').textContent = boardData.name;
    
    // Render Classroom Tabs
    const tabsContainer = document.getElementById('studentClassroomTabs');
    tabsContainer.innerHTML = (boardData.classrooms || []).map((c, i) => `
        <button class="classroom-tab ${i === activeClassroomIndex ? 'active' : ''}" onclick="selectStudentClassroom(${i})">
            <i class="fas fa-users"></i> ${c.name}
        </button>
    `).join('');

    const c = document.getElementById('sectionsContainer');
    c.className = 'sections-container layout-'+tpl;
    c.innerHTML = '';
    
    if(!boardData.classrooms || boardData.classrooms.length === 0) {
        c.innerHTML = '<div style="color:var(--text2);padding:20px;">บอร์ดนี้ยังไม่มีห้องเรียนและงาน</div>';
        return;
    }
    
    if(activeClassroomIndex >= boardData.classrooms.length) activeClassroomIndex = 0;
    const activeClassroom = boardData.classrooms[activeClassroomIndex];
    
    if(!activeClassroom.assignments || activeClassroom.assignments.length === 0) {
        c.innerHTML = '<div style="color:var(--text2);padding:20px;">ห้องเรียนนี้ยังไม่มีงานมอบหมาย</div>';
        return;
    }
    
    activeClassroom.assignments.forEach((s,i)=>{
        const div = document.createElement('div'); div.className = 'section';
        const postsHTML = s.posts ? s.posts.map((p,pi)=>{
            const imgAttach = p.attachments ? p.attachments.filter(a=>a.dataUrl) : [];
            const fileAttach = p.attachments ? p.attachments.filter(a=>!a.dataUrl) : [];
            const imagesHTML = imgAttach.length
                ? `<div class="post-images">${imgAttach.map(a=>`<img src="${a.dataUrl}" class="post-img-thumb${imgAttach.length===1?' single':''}" title="${a.name}" onclick="viewImg('${a.dataUrl}')">`).join('')}</div>`
                : '';
            const chipsHTML = fileAttach.length
                ? `<div class="post-chips">${fileAttach.map(a=>`<span class="chip"><i class="fas fa-${a.icon}"></i>${a.name}</span>`).join('')}</div>`
                : '';
            const isGraded = p.isGraded === true;
            const badgeHTML = isGraded 
                ? `<span style="background:rgba(20,184,166,0.15);color:var(--primary-light);border:1px solid rgba(20,184,166,0.3);padding:2px 8px;border-radius:12px;font-size:0.75rem;margin-bottom:8px;display:inline-block;"><i class="fas fa-check-double"></i> ตรวจแล้ว</span>`
                : `<span style="background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);padding:2px 8px;border-radius:12px;font-size:0.75rem;margin-bottom:8px;display:inline-block;"><i class="fas fa-hourglass-half"></i> กำลังรอตรวจ</span>`;
                
            const actionsHTML = isGraded 
                ? '' 
                : `<div class="post-actions">
                    <button class="icon-btn" title="แก้ไข" onclick="editPost(${i},${pi})"><i class="fas fa-pen" style="color:#94a3b8"></i></button>
                    <button class="icon-btn" onclick="askDel('ลบโพสต์?',()=>delPost(${i},${pi}))"><i class="fas fa-trash-alt" style="color:#f87171"></i></button>
                </div>`;
                
            return `<div class="post">
                ${badgeHTML}
                <div class="post-title"><i class="fas fa-file-alt" style="color:var(--accent);font-size:.8rem"></i>${p.title}</div>
                ${p.desc ? `<div class="post-meta">${p.desc}</div>` : ''}
                ${imagesHTML}${chipsHTML}
                ${actionsHTML}
            </div>`;
        }).join('') : '';
        div.innerHTML = `
        <div class="section-header">
            <div class="section-name"><i class="fas fa-tasks"></i><span>${s.name}</span></div>
        </div>
        <div class="section-body">
            ${s.desc ? `<div class="section-desc">${s.desc}</div>` : ''}
            <div class="posts">${postsHTML}</div>
            <button class="add-post-btn" onclick="openPost(${i})"><i class="fas fa-plus"></i>ส่งงาน</button>
        </div>`;
        c.appendChild(div);
    });
}

// --- Real-time Boards ---
let allBoards = {};
function initRealtimeBoards() {
    onValue(ref(db, 'boards_index'), (snap) => {
        allBoards = snap.exists() ? snap.val() : {};
        renderBoardList();
    });
}

function renderBoardList(){
    const sec=document.getElementById('myBoardsSection'), list=document.getElementById('boardList');
    let boardArray = Object.keys(allBoards).map(id => ({ id, ...allBoards[id] }));
    
    if(!boardArray.length){sec.style.display='none';return;}
    
    // Sort newest first
    boardArray.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    
    sec.style.display='block';
    list.innerHTML=boardArray.map(b=>`<div class="board-card" onclick="openBoard('${b.id}')">
        <div class="board-card-title"><i class="fas fa-chalkboard"></i>${b.name}</div>
        <div class="board-card-date"><i class="fas fa-clock"></i> เปิดเมื่อ: ${b.ts ? new Date(b.ts).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}) : '-'}</div>
    </div>`).join('');
}
window.openBoard = (id) => { window.location.hash = id; load(id); };
window.shareBoard = () => {
    const url = window.location.href;
    navigator.clipboard.writeText(url)
        .then(() => showToast('คัดลอกลิงก์บอร์ดแล้ว สามารถส่งให้คนอื่นได้เลย!'))
        .catch(() => showToast('ไม่สามารถคัดลอกลิงก์ได้', 'fas fa-times-circle'));
};
window.goHome = () => { window.location.hash = ''; renderBoardList(); showPage('pageLanding'); document.getElementById('headerActions').innerHTML=''; };
let pendingAttachments = [];
function renderChips(){
    const c = document.getElementById('attachChips');
    if(!c) return;
    c.innerHTML = '';
    const grid = document.createElement('div'); grid.className = 'attach-preview-grid';
    const chipsRow = document.createElement('div'); chipsRow.className = 'attach-chips';
    pendingAttachments.forEach((a,i)=>{
        if(a.dataUrl){
            const wrap = document.createElement('div'); wrap.className = 'attach-preview-item';
            wrap.innerHTML = `<img src="${a.dataUrl}" class="attach-preview-img" title="${a.name}"><button class="attach-preview-del" onclick="removeChip(${i})">✕</button>`;
            grid.appendChild(wrap);
        } else {
            const chip = document.createElement('span'); chip.className = 'chip';
            chip.innerHTML = `<i class="fas fa-${a.icon}"></i>${a.name}<span class="chip-del" onclick="removeChip(${i})">✕</span>`;
            chipsRow.appendChild(chip);
        }
    });
    if(grid.children.length) c.appendChild(grid);
    if(chipsRow.children.length) c.appendChild(chipsRow);
}
window.removeChip = (i) => { pendingAttachments.splice(i,1); renderChips(); };
function compressImage(file){
    return new Promise(resolve=>{
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const MAX = 900;
                let w = img.width, h = img.height;
                if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
                if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img,0,0,w,h);
                resolve(canvas.toDataURL('image/jpeg', 0.65));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}
const IMG_EXTS = ['jpg','jpeg','png','gif','webp','bmp','svg'];
window.handleAttach = async (input, type) => {
    const files = Array.from(input.files);
    for(const f of files){
        const ext = f.name.split('.').pop().toLowerCase();
        const isImg = IMG_EXTS.includes(ext) || type==='image' || type==='camera';
        const shortName = f.name.length>22 ? f.name.substring(0,22)+'…' : f.name;
        if(isImg){
            const dataUrl = await compressImage(f);
            pendingAttachments.push({name: shortName, icon:'image', type, dataUrl});
        } else {
            let icon='paperclip';
            if(ext==='pdf') icon='file-pdf';
            else if(['doc','docx'].includes(ext)) icon='file-word';
            else if(['xls','xlsx'].includes(ext)) icon='file-excel';
            else if(['mp4','mov','avi','mkv'].includes(ext)) icon='file-video';
            pendingAttachments.push({name: shortName, icon, type});
        }
    }
    renderChips(); input.value='';
};
window.addLinkAttach = () => {
    const url = prompt('วาง URL ลิงก์:');
    if(url && url.trim()){
        const display = url.length > 30 ? url.substring(0,30)+'…' : url;
        pendingAttachments.push({name: display, icon:'link', type:'link', url: url.trim()});
        renderChips();
    }
};
window.addOtherAttach = () => {
    const txt = prompt('กรอกชื่อหรือรายละเอียดไฟล์อื่นๆ:');
    if(txt && txt.trim()){ pendingAttachments.push({name: txt.trim(), icon:'question-circle', type:'other'}); renderChips(); }
};
let editPostIdx = null; // null = add mode, {si,pi} = edit mode
window.openPost = (i) => {
    curIdx = i; pendingAttachments = []; editPostIdx = null;
    document.getElementById('postTitle').value='';
    document.getElementById('postDesc').value='';
    document.getElementById('modalPostTitle').textContent = 'เพิ่มโพสต์';
    renderChips();
    document.getElementById('modalPost').classList.add('active');
};
window.editPost = (si, pi) => {
    const cls = boardData.classrooms[activeClassroomIndex];
    const p = cls.assignments[si].posts[pi];
    curIdx = si; editPostIdx = pi;
    pendingAttachments = p.attachments ? [...p.attachments] : [];
    document.getElementById('postTitle').value = p.title || '';
    document.getElementById('postDesc').value = p.desc || '';
    document.getElementById('modalPostTitle').textContent = 'แก้ไขโพสต์';
    renderChips();
    document.getElementById('modalPost').classList.add('active');
};
window.closeModal = (id) => document.getElementById(id).classList.remove('active');
window.savePost = () => {
    const t = document.getElementById('postTitle').value.trim(); if(!t){ showToast('กรุณากรอกชื่อเรื่อง','fas fa-exclamation-circle'); return; }
    const postObj = { title: t, desc: document.getElementById('postDesc').value.trim(), attachments: [...pendingAttachments] };
    const cls = boardData.classrooms[activeClassroomIndex];
    if(!cls.assignments[curIdx].posts) cls.assignments[curIdx].posts=[];
    
    if(editPostIdx !== null){
        cls.assignments[curIdx].posts[editPostIdx] = postObj;
        showToast('บันทึกการแก้ไขแล้ว!');
    } else {
        cls.assignments[curIdx].posts.push(postObj);
        showToast('เพิ่มโพสต์สำเร็จ!');
    }
    closeModal('modalPost'); 
    save(); // Since we use onValue, render() will be called automatically, but save() triggers Firebase update
};
window.delPost = (si,pi) => { 
    const cls = boardData.classrooms[activeClassroomIndex];
    cls.assignments[si].posts.splice(pi,1); 
    save(); 
};
window.viewImg = (src) => {
    const ov = document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out;backdrop-filter:blur(6px)';
    ov.innerHTML=`<img src="${src}" style="max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.7)">`;
    ov.onclick=()=>ov.remove(); document.body.appendChild(ov);
};
window.askDel = (msg,ok) => { document.getElementById('confirmText').innerText = msg; document.getElementById('confirmOkBtn').onclick = () => { ok(); closeModal('modalConfirm'); }; document.getElementById('modalConfirm').classList.add('active'); };
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showToast(msg, icon='fas fa-check-circle'){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<i class="${icon}"></i>${msg}`; document.body.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); },2500); }
window.onload = () => {
    initRealtimeBoards();
    const h = window.location.hash.substring(1);
    if(h.startsWith('B-')) load(h);
};
</script>
