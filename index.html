<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassBoard - ส่งงานออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0f766e;--primary-light:#14b8a6;--accent:#6366f1;--dark:#0f172a;--glass:rgba(15,23,42,0.85);--glass2:rgba(255,255,255,0.08);--text:#f1f5f9;--text2:#94a3b8;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,0.5)}
body{font-family:'IBM Plex Sans Thai','Prompt',sans-serif;background:#0a0f1e;color:var(--text);min-height:100vh;overflow-x:hidden}
.bg-fixed{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0a0f1e 0%,#0d1b2a 30%,#1b2a4a 60%,#0f766e 100%);opacity:.9}
.app{position:relative;z-index:1;min-height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;backdrop-filter:blur(20px);background:var(--glass);border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:700;cursor:pointer}
.logo i{color:var(--primary-light)}
.logo span{background:linear-gradient(135deg,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Landing */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 70px);text-align:center;padding:40px 20px}
.landing h1{font-size:3rem;font-weight:700;margin-bottom:16px;color:#fff}
.board-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:32px;width:100%;max-width:1000px}
.board-card{background:var(--glass);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:24px;cursor:pointer;transition:all .3s;text-align:left}
.board-card:hover{transform:translateY(-5px);border-color:var(--primary-light)}

/* Board View */
.page{display:none}
.page.active{display:block}
.classroom-tabs{display:flex;gap:10px;padding:15px 32px;overflow-x:auto;background:rgba(0,0,0,0.2)}
.classroom-tab{padding:8px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .2s}
.classroom-tab.active{background:var(--primary);color:#fff;border-color:var(--primary-light)}

.board-body{padding:20px 32px 40px}
.sections-container{display:flex;gap:24px;overflow-x:auto;padding-bottom:20px}
.section{width:320px;flex-shrink:0;background:var(--glass);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:20px}
.section-name{font-weight:600;font-size:1.1rem;color:var(--primary-light);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-desc{font-size:0.85rem;color:var(--text2);margin-bottom:15px;white-space:pre-wrap}

.post{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:12px;position:relative}
.post-title{font-weight:600;margin-bottom:8px}
.post-images img{width:100%;border-radius:8px;margin-top:8px;cursor:pointer}
.post-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}

/* Badges */
.badge{font-size:0.7rem;padding:2px 8px;border-radius:10px;font-weight:600;margin-bottom:8px;display:inline-block}
.badge-pending{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
.badge-graded{background:rgba(20,184,166,0.15);color:var(--primary-light);border:1px solid rgba(20,184,166,0.3)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border-radius:16px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto}
.input{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;margin-bottom:15px;font-family:inherit}

.btn{padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-glass{background:rgba(255,255,255,0.05);color:var(--text2);border:1px solid rgba(255,255,255,0.1)}
.btn-sm{padding:6px 12px;font-size:0.8rem}

.toast{position:fixed;bottom:20px;right:20px;padding:12px 24px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:10px;z-index:999;box-shadow:var(--shadow);animation:slideIn .3s ease;color:var(--text)}
@keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}

.loading-msg{text-align:center;padding:40px;color:var(--text2);font-size:0.9rem}
</style>
</head>
<body>
<div class="bg-fixed"></div>
<div class="app">
    <div class="header">
        <div class="logo" onclick="goHome()"><i class="fas fa-layer-group"></i><span>ClassBoard</span></div>
        <div id="headerActions"></div>
    </div>

    <div class="page active" id="pageLanding">
        <div class="landing">
            <h1>🎓 กระดานส่งงาน</h1>
            <p>เลือกวิชาที่ต้องการส่งงานด้านล่าง</p>
            <div class="board-list" id="boardList">
                <p class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>

    <div class="page" id="pageBoard">
        <div class="classroom-tabs" id="classroomTabs"></div>
        <div class="board-body">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-left:10px;">
                <button class="btn btn-glass btn-sm" onclick="goHome()"><i class="fas fa-arrow-left"></i> กลับ</button>
                <h2 id="boardTitleText"></h2>
            </div>
            <div id="sectionsContainer" class="sections-container"></div>
        </div>
    </div>
</div>

<!-- Modal Post -->
<div class="modal-overlay" id="modalPost">
    <div class="modal">
        <h3 id="modalPostTitle">ส่งงานใหม่</h3>
        <div style="margin-top:15px">
            <label style="font-size:0.85rem;color:var(--text2)">หัวข้อ/ชื่อนักเรียน <span style="color:#ef4444">*</span></label>
            <input class="input" id="postTitle" placeholder="เช่น นายสมชาย เลขที่ 1">
            <label style="font-size:0.85rem;color:var(--text2)">รายละเอียดงาน</label>
            <textarea class="input" id="postDesc" style="height:100px" placeholder="คำอธิบายเพิ่มเติม..."></textarea>
            <div style="margin-bottom:15px">
                <button class="btn btn-glass btn-sm" onclick="document.getElementById('inp_file').click()"><i class="fas fa-image"></i> แนบรูปภาพ</button>
                <input type="file" id="inp_file" accept="image/*" multiple style="display:none" onchange="handleFiles(this)">
                <div id="filePreview" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;"></div>
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
            <button class="btn btn-glass" onclick="closeModal('modalPost')">ยกเลิก</button>
            <button class="btn btn-primary" onclick="savePost()">บันทึก</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAW8vcTatshwGbi9N_SOJoxhwt9ckPiYis",
  authDomain: "classcoin-99bf6.firebaseapp.com",
  databaseURL: "https://classcoin-99bf6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classcoin-99bf6",
  storageBucket: "classcoin-99bf6.firebasestorage.app",
  messagingSenderId: "736532364280",
  appId: "1:736532364280:web:6f3b07131119c1e0e1b40d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// ===== State =====
let boardId = null;
let boardData = {};
let activeClassIndex = 0;
let currentAsgnIndex = null;
let editPostIndex = null;
let pendingFiles = [];

// ===== Utility Functions =====
function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

// ===== Global Functions (accessible from HTML onclick) =====
window.goHome = function() {
    window.location.hash = '';
    showPage('pageLanding');
    boardId = null;
    boardData = {};
    activeClassIndex = 0;
};

window.closeModal = function(id) {
    document.getElementById(id).classList.remove('active');
};

window.openBoard = function(id) {
    window.location.hash = id;
    loadBoard(id);
};

window.selectClass = function(i) {
    activeClassIndex = i;
    renderBoard();
};

window.openAddPost = function(ai) {
    currentAsgnIndex = ai;
    editPostIndex = null;
    pendingFiles = [];
    document.getElementById('postTitle').value = '';
    document.getElementById('postDesc').value = '';
    document.getElementById('filePreview').innerHTML = '';
    document.getElementById('modalPostTitle').innerText = 'ส่งงานใหม่';
    document.getElementById('modalPost').classList.add('active');
};

window.editPost = function(ai, pi) {
    currentAsgnIndex = ai;
    editPostIndex = pi;
    const p = boardData.classrooms[activeClassIndex].assignments[ai].posts[pi];
    document.getElementById('postTitle').value = p.title;
    document.getElementById('postDesc').value = p.desc || '';
    pendingFiles = p.attachments ? [...p.attachments] : [];
    document.getElementById('modalPostTitle').innerText = 'แก้ไขงาน';
    renderFilePreview();
    document.getElementById('modalPost').classList.add('active');
};

window.handleFiles = function(input) {
    for (const f of input.files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            pendingFiles.push({ dataUrl: e.target.result });
            renderFilePreview();
        };
        reader.readAsDataURL(f);
    }
    input.value = ''; // reset so same file can be re-selected
};

window.removeFile = function(i) {
    pendingFiles.splice(i, 1);
    renderFilePreview();
};

window.savePost = async function() {
    const title = document.getElementById('postTitle').value.trim();
    if (!title) { alert('กรุณากรอกชื่อ'); return; }

    const post = {
        title: title,
        desc: document.getElementById('postDesc').value.trim(),
        attachments: pendingFiles
    };

    const cls = boardData.classrooms[activeClassIndex];
    if (!cls.assignments[currentAsgnIndex].posts) {
        cls.assignments[currentAsgnIndex].posts = [];
    }

    if (editPostIndex !== null) {
        // Preserve grading status when editing
        const oldPost = cls.assignments[currentAsgnIndex].posts[editPostIndex];
        if (oldPost && oldPost.isGraded) {
            post.isGraded = oldPost.isGraded;
        }
        cls.assignments[currentAsgnIndex].posts[editPostIndex] = post;
    } else {
        cls.assignments[currentAsgnIndex].posts.push(post);
    }

    try {
        await set(ref(db, 'boards/' + boardId), boardData);
        // Preserve createdBy when updating index
        await set(ref(db, 'boards_index/' + boardId), {
            name: boardData.name,
            ts: Date.now(),
            createdBy: boardData.createdBy || 'System'
        });
        closeModal('modalPost');
        showToast('บันทึกสำเร็จ');
    } catch (err) {
        console.error('Save error:', err);
        showToast('เกิดข้อผิดพลาดในการบันทึก');
    }
};

window.deletePost = async function(ai, pi) {
    if (!confirm('ลบโพสต์นี้?')) return;
    boardData.classrooms[activeClassIndex].assignments[ai].posts.splice(pi, 1);
    try {
        await set(ref(db, 'boards/' + boardId), boardData);
        showToast('ลบแล้ว');
    } catch (err) {
        console.error('Delete error:', err);
        showToast('เกิดข้อผิดพลาดในการลบ');
    }
};

window.viewImg = function(src) {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
    ov.innerHTML = '<img src="' + src + '" style="max-width:90vw;max-height:90vh;border-radius:10px;">';
    ov.onclick = function() { ov.remove(); };
    document.body.appendChild(ov);
};

// ===== Render Functions =====
function renderFilePreview() {
    const container = document.getElementById('filePreview');
    container.innerHTML = pendingFiles.map(function(f, i) {
        return '<div style="position:relative">' +
            '<img src="' + f.dataUrl + '" style="width:60px;height:60px;object-fit:cover;border-radius:5px;">' +
            '<i class="fas fa-times-circle" style="position:absolute;top:-5px;right:-5px;color:#ef4444;cursor:pointer" onclick="removeFile(' + i + ')"></i>' +
            '</div>';
    }).join('');
}

function renderBoard() {
    showPage('pageBoard');
    document.getElementById('boardTitleText').innerText = boardData.name || 'Untitled Board';

    // Render classroom tabs
    const tabsEl = document.getElementById('classroomTabs');
    tabsEl.innerHTML = boardData.classrooms.map(function(c, i) {
        return '<div class="classroom-tab ' + (i === activeClassIndex ? 'active' : '') + '" onclick="selectClass(' + i + ')">' + (c.name || 'ห้องเรียน') + '</div>';
    }).join('');

    // Render assignments
    const cls = boardData.classrooms[activeClassIndex] || { assignments: [] };
    const container = document.getElementById('sectionsContainer');

    container.innerHTML = (cls.assignments || []).map(function(a, ai) {
        var postsHTML = (a.posts || []).map(function(p, pi) {
            var isGraded = p.isGraded === true;
            var badge = isGraded
                ? '<span class="badge badge-graded">ตรวจแล้ว</span>'
                : '<span class="badge badge-pending">กำลังรอตรวจ</span>';

            var images = (p.attachments || []).map(function(img) {
                return '<img src="' + img.dataUrl + '" onclick="viewImg(\'' + img.dataUrl.replace(/'/g, "\\'") + '\')">';
            }).join('');

            var actions = isGraded ? '' :
                '<div class="post-actions">' +
                '<button class="btn btn-glass btn-sm" onclick="editPost(' + ai + ',' + pi + ')"><i class="fas fa-pen"></i></button>' +
                '<button class="btn btn-glass btn-sm" onclick="deletePost(' + ai + ',' + pi + ')"><i class="fas fa-trash-alt"></i></button>' +
                '</div>';

            return '<div class="post">' +
                badge +
                '<div class="post-title">' + p.title + '</div>' +
                '<div style="font-size:0.85rem;color:var(--text2)">' + (p.desc || '') + '</div>' +
                '<div class="post-images">' + images + '</div>' +
                actions +
                '</div>';
        }).join('');

        return '<div class="section">' +
            '<div class="section-name"><i class="fas fa-tasks"></i> ' + a.name + '</div>' +
            '<div class="section-desc">' + (a.desc || '') + '</div>' +
            '<div>' + postsHTML + '</div>' +
            '<button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" onclick="openAddPost(' + ai + ')"><i class="fas fa-plus"></i> ส่งงาน</button>' +
            '</div>';
    }).join('');
}

// ===== Firebase Data Loading =====
function loadBoard(id) {
    if (!id) return;
    onValue(ref(db, 'boards/' + id), function(snap) {
        if (!snap.exists()) {
            showToast('ไม่พบบอร์ดนี้ในระบบ');
            goHome();
            return;
        }
        boardId = id;
        boardData = snap.val();

        // Safety: Ensure classrooms array exists
        if (!boardData.classrooms || boardData.classrooms.length === 0) {
            boardData.classrooms = [{ name: 'ทั่วไป', assignments: [] }];
        }
        if (activeClassIndex >= boardData.classrooms.length) {
            activeClassIndex = 0;
        }
        renderBoard();
    }, function(error) {
        console.error('Load Board Error:', error);
        showToast('ไม่สามารถโหลดบอร์ดได้');
    });
}

function loadBoardList() {
    onValue(ref(db, 'boards_index'), function(snap) {
        var list = snap.val() || {};
        var container = document.getElementById('boardList');
        if (!container) return;

        var keys = Object.keys(list);
        if (keys.length === 0) {
            container.innerHTML = '<p class="loading-msg">ยังไม่มีบอร์ดในระบบ</p>';
            return;
        }

        container.innerHTML = keys.map(function(id) {
            return '<div class="board-card" onclick="openBoard(\'' + id + '\')">' +
                '<b>' + list[id].name + '</b>' +
                '<div style="font-size:0.8rem;color:var(--text2);margin-top:8px;">' +
                '<i class="fas fa-user"></i> ครู: ' + (list[id].createdBy || 'System') +
                '</div>' +
                '</div>';
        }).join('');
    }, function(error) {
        console.error('Load board list error:', error);
        document.getElementById('boardList').innerHTML = '<p class="loading-msg" style="color:#fca5a5;">เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณารีเฟรชหน้าจอ</p>';
    });
}

// ===== Initialize =====
signInAnonymously(auth).then(function() {
    console.log('✅ Authenticated');

    // Load board list
    loadBoardList();

    // Check if URL has board hash
    var h = window.location.hash.substring(1);
    if (h) loadBoard(h);

}).catch(function(err) {
    console.error('❌ Auth Error:', err);
    document.getElementById('boardList').innerHTML = '<p class="loading-msg" style="color:#fca5a5;">การเชื่อมต่อล้มเหลว กรุณารีเฟรชหน้าจอ</p>';
});

// Handle browser back/forward
window.addEventListener('hashchange', function() {
    var h = window.location.hash.substring(1);
    if (h) {
        loadBoard(h);
    } else {
        showPage('pageLanding');
    }
});

</script>
</body>
</html>
